# Automata — dark variant of the "NieR: Automata" palette from t3themes.com
# (https://t3themes.com/themes/nier-automata/). Charcoal paper, parchment ink,
# monochrome accent. Surface and text values are lifted from the t3 dark
# variant; ANSI hues are low-chroma so nothing competes with the ink.

